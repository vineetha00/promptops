name: PromptOps Regression Check

on:
  pull_request:
    paths:
      - ".promptops/**"
      - "prompts/**"
      - "**/*.prompt"

permissions:
  contents: read

jobs:
  prompt-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install from an exact tag in this project's repo, never by name from
      # PyPI: the "promptops" name on PyPI belongs to an unrelated project, and
      # this job runs with ANTHROPIC_API_KEY in its environment.
      - name: Install promptops
        run: pip install "git+https://github.com/vineetha00/promptops@v0.2.0"

      # The baseline prompts and eval sets are read from the PR's base branch,
      # not from the PR checkout. Exit 2 (eval could not run, e.g. no API key
      # on a fork PR) fails the check just like a regression does.
      - name: Run prompt regression eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: promptops eval --compare "origin/${BASE_REF}..HEAD" --fail-on-regression
